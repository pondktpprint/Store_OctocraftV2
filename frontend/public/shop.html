<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Octo Craft SMP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="shop-page">
    <div class="bubbles" id="bubbles-container"></div>

    <nav class="shop-nav">
        <a href="index.html" class="back-home-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
        <div class="shop-logo-small">
            <img src="images/logo.png" alt="Octo Craft Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback-small').style.display='block';">
            <div id="logo-fallback-small" class="logo-fallback" style="font-size: 1.5rem; display:none;">OCTOCRAFT</div>
        </div>
        <div class="shop-nav-actions">
            <div class="user-profile-menu"></div>
            <button class="cart-toggle-btn" id="cart-open-btn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
            </button>
        </div>
    </nav>

    <main class="shop-container">
        <div class="items-grid" id="items-grid">
            <div style="text-align: center; width: 100%; color: white;">กำลังโหลดสินค้า...</div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> ตะกร้าสินค้า</h2>
            <button class="close-cart-btn" id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <div class="empty-cart-msg">ยังไม่มีสินค้าในตะกร้า</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>ยอดรวมทั้งหมด:</span>
                <span id="cart-total-price">0 Points</span>
            </div>
            <button class="checkout-btn">ดำเนินการชำระเงิน</button>
        </div>
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="details-modal">
        <div class="modal-content shop-modal-content">
            <button class="close-modal">&times;</button>
            <div id="details-modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!App.state.token) {
                window.location.href = 'index.html?login=true';
                return;
            }

            let shopItems = [];

            try {
                const res = await App.api('/api/products');
                if (res.ok) {
                    shopItems = res.products;
                    renderProducts(shopItems);
                } else {
                    document.getElementById('items-grid').innerHTML = '<div style="color:red;">ไม่สามารถโหลดสินค้าได้</div>';
                }
            } catch (err) {
                document.getElementById('items-grid').innerHTML = '<div style="color:red;">ไม่สามารถโหลดสินค้าได้</div>';
            }

            function renderProducts(products) {
                const grid = document.getElementById('items-grid');
                grid.innerHTML = '';
                
                products.forEach(item => {
                    const card = document.createElement('div');
                    card.classList.add('item-card');
                    card.innerHTML = `
                        <div class="item-img-container">
                            <img src="https://cdn-icons-png.flaticon.com/512/2838/2838575.png" alt="${item.name}" class="item-image">
                        </div>
                        <div class="item-info-shop">
                            <h3 class="item-name">${item.name}</h3>
                            <div class="item-price">${item.price_points} Points</div>
                        </div>
                        <div class="item-actions">
                            <div class="qty-selector">
                                <button onclick="updateLocalQty('${item.id}', -1)">-</button>
                                <input type="number" id="qty-${item.id}" value="1" min="1" max="99">
                                <button onclick="updateLocalQty('${item.id}', 1)">+</button>
                            </div>
                            <div class="action-btns">
                                <button class="details-btn" onclick="openProductDetails(${item.id})"><i class="fas fa-info-circle"></i></button>
                                <button class="add-cart-btn" onclick="addToCartLocal(event, ${item.id})"><i class="fas fa-cart-plus"></i></button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            window.updateLocalQty = (id, change) => {
                const input = document.getElementById(`qty-${id}`);
                let val = parseInt(input.value) + change;
                if (val < 1) val = 1;
                if (val > 99) val = 99;
                input.value = val;
            };

            window.addToCartLocal = (event, id) => {
                const item = shopItems.find(i => i.id === id);
                const qty = document.getElementById(`qty-${id}`).value;
                App.addToCart(item, qty);
                
                const btn = event.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                btn.style.background = '#00ff88';
                setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 800);
            };

            window.openProductDetails = (id) => {
                const item = shopItems.find(i => i.id === id);
                const body = document.getElementById('details-modal-body');
                body.innerHTML = `
                    <div class="details-header">
                        <div class="details-img-bg">
                            <img src="https://cdn-icons-png.flaticon.com/512/2838/2838575.png" alt="${item.name}" class="details-image">
                        </div>
                        <h2 class="details-title">${item.name}</h2>
                        <div class="details-price">${item.price_points} Points</div>
                    </div>
                    <div class="details-desc">
                        <p>${item.description}</p>
                        <p><small>SKU: ${item.sku}</small></p>
                    </div>
                    <button class="details-add-cart" onclick="App.addToCart({id: ${item.id}, name: '${item.name}', price_points: ${item.price_points}}, 1); document.getElementById('details-modal').classList.remove('active');"><i class="fas fa-cart-plus"></i> เพิ่มลงตะกร้า 1 ชิ้น</button>
                `;
                document.getElementById('details-modal').classList.add('active');
            };
        });
    </script>
</body>
</html>
