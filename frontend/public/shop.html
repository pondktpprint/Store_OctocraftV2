<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Octo Craft SMP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="shop-page">
    <div class="bubbles" id="bubbles-container"></div>

    <nav class="shop-nav">
        <a href="index.html" class="back-home-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
        <div class="shop-logo-small">
            <img src="images/logo.png" alt="Octo Craft Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback-small').style.display='block';">
            <div id="logo-fallback-small" class="logo-fallback" style="font-size: 1.5rem; display:none;">OCTOCRAFT</div>
        </div>
        <div class="shop-nav-actions">
            <div class="user-profile-menu"></div>
            <button class="cart-toggle-btn" id="cart-open-btn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
            </button>
        </div>
    </nav>

    <main class="shop-container">
        <style>
            .shop-layout-wrapper {
                display: flex;
                gap: 40px;
                width: 100%;
                align-items: flex-start;
                margin-top: 10px;
            }
            .shop-sidebar {
                flex: 0 0 280px;
                position: sticky;
                top: 100px;
                background: rgba(15, 20, 35, 0.5);
                border: 1px solid rgba(138, 43, 226, 0.25);
                border-radius: 20px;
                padding: 25px;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }
            .shop-sidebar-title {
                font-size: 1.3rem;
                font-weight: 800;
                margin-top: 0;
                margin-bottom: 20px;
                color: white;
                display: flex;
                align-items: center;
                gap: 10px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .shop-sidebar-title i {
                color: var(--primary-blue);
            }
            .sidebar-category-menu {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }
            .sidebar-category-btn {
                width: 100%;
                justify-content: flex-start;
                padding: 14px 20px;
                border-radius: 12px;
                font-size: 1rem;
                display: flex;
                align-items: center;
                gap: 12px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.05);
                color: #94a3b8;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                backdrop-filter: blur(10px);
            }
            .sidebar-category-btn:hover {
                background: rgba(255, 255, 255, 0.08);
                color: #f8fafc;
                transform: translateX(5px);
            }
            .sidebar-category-btn.active {
                background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
                color: white;
                border-color: transparent;
                box-shadow: 0 5px 15px var(--glow-purple);
            }
            .sidebar-category-btn i {
                width: 24px;
                text-align: center;
            }
            .shop-main-content {
                flex: 1;
                min-width: 0;
            }
            
            @media (max-width: 900px) {
                .shop-layout-wrapper {
                    flex-direction: column;
                }
                .shop-sidebar {
                    flex: auto;
                    width: 100%;
                    position: static;
                }
                .sidebar-category-btn:hover {
                    transform: translateY(-2px);
                }
            }
        </style>

        <div class="shop-layout-wrapper">
            <!-- Category Sidebar (Left) -->
            <div class="shop-sidebar">
                <h2 class="shop-sidebar-title">
                    <i class="fas fa-list-ul"></i> หมวดหมู่สินค้า
                </h2>
                <div class="sidebar-category-menu">
                    <button class="sidebar-category-btn category-btn active" onclick="filterByCategory('all')">
                        <i class="fas fa-cubes"></i> ทั้งหมด
                    </button>
                    <button class="sidebar-category-btn category-btn" onclick="filterByCategory('Rank')">
                        <i class="fas fa-crown"></i> ยศ (Rank)
                    </button>
                    <button class="sidebar-category-btn category-btn" onclick="filterByCategory('Key')">
                        <i class="fas fa-key"></i> กุญแจ (Key)
                    </button>
                    <button class="sidebar-category-btn category-btn" onclick="filterByCategory('Privilege')">
                        <i class="fas fa-gem"></i> สิทธิพิเศษ (Privilege)
                    </button>
                </div>
            </div>

            <!-- Items Grid (Right) -->
            <div class="shop-main-content">
                <div class="items-grid" id="items-grid">
                    <div style="text-align: center; width: 100%; color: white; padding: 40px;">กำลังโหลดสินค้า...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> ตะกร้าสินค้า</h2>
            <button class="close-cart-btn" id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <div class="empty-cart-msg">ยังไม่มีสินค้าในตะกร้า</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>ยอดรวมทั้งหมด:</span>
                <span id="cart-total-price">0 Points</span>
            </div>
            <button class="checkout-btn">ดำเนินการชำระเงิน</button>
        </div>
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="details-modal">
        <div class="modal-content shop-modal-content">
            <button class="close-modal">&times;</button>
            <div id="details-modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!App.state.token) {
                window.location.href = 'index.html?login=true';
                return;
            }

            let shopItems = [];
            let currentCategory = 'all';

            try {
                const res = await App.api('/api/products');
                if (res.ok) {
                    shopItems = res.products;
                    renderProducts(shopItems);
                } else {
                    document.getElementById('items-grid').innerHTML = '<div style="color:red; text-align:center;">ไม่สามารถโหลดสินค้าได้</div>';
                }
            } catch (err) {
                document.getElementById('items-grid').innerHTML = '<div style="color:red; text-align:center;">ไม่สามารถโหลดสินค้าได้</div>';
            }

            function getItemIcon(item) {
                if (item.category === 'Rank') return 'https://cdn-icons-png.flaticon.com/512/2838/2838575.png';
                if (item.category === 'Key') return 'https://cdn-icons-png.flaticon.com/512/3218/3218006.png';
                if (item.category === 'Privilege') return 'https://cdn-icons-png.flaticon.com/512/3208/3208756.png';
                return 'https://cdn-icons-png.flaticon.com/512/2838/2838575.png';
            }

            function renderProducts(products) {
                const grid = document.getElementById('items-grid');
                grid.innerHTML = '';
                
                if (products.length === 0) {
                    grid.innerHTML = '<div style="text-align: center; width: 100%; color: var(--text-muted); padding: 40px; font-size: 1.1rem;">ไม่มีสินค้าในหมวดหมู่นี้</div>';
                    return;
                }

                products.forEach(item => {
                    const card = document.createElement('div');
                    card.classList.add('item-card');
                    card.innerHTML = `
                        <div class="item-img-container">
                            <img src="${getItemIcon(item)}" alt="${item.name}" class="item-image">
                        </div>
                        <div class="item-info-shop">
                            <span class="badge" style="background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.08); display: inline-block; margin-bottom: 8px;">${item.category || 'Rank'}</span>
                            <h3 class="item-name" style="margin-top:0;">${item.name}</h3>
                            <div class="item-price"><i class="fas fa-coins"></i> ${item.price_points.toLocaleString()} Points</div>
                        </div>
                        <div class="item-actions" style="margin-top:15px; display:flex; flex-direction:column; gap:12px;">
                            <div class="qty-selector" style="display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); border-radius:8px; overflow:hidden;">
                                <button onclick="updateLocalQty('${item.id}', -1)" style="background:none; border:none; color:white; width:35px; height:35px; font-size:1.2rem; cursor:pointer;">-</button>
                                <input type="number" id="qty-${item.id}" value="1" min="1" max="99" readonly style="background:none; border:none; color:white; width:40px; text-align:center; font-size:1rem; font-weight:bold;">
                                <button onclick="updateLocalQty('${item.id}', 1)" style="background:none; border:none; color:white; width:35px; height:35px; font-size:1.2rem; cursor:pointer;">+</button>
                            </div>
                            <div class="action-btns" style="display:flex; gap:10px;">
                                <button class="details-btn" onclick="openProductDetails(${item.id})" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; cursor:pointer; font-weight:600;"><i class="fas fa-info-circle"></i> รายละเอียด</button>
                                <button class="add-cart-btn" onclick="addToCartLocal(event, ${item.id})" style="flex:1.2; padding:10px; border-radius:8px; border:none; background:var(--primary); color:white; cursor:pointer; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px;"><i class="fas fa-shopping-cart"></i> ใส่ตะกร้า</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            window.filterByCategory = (category) => {
                currentCategory = category;
                document.querySelectorAll('.category-btn').forEach(btn => {
                    const onclickStr = btn.getAttribute('onclick') || '';
                    if (onclickStr.includes(`'${category}'`)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                if (category === 'all') {
                    renderProducts(shopItems);
                } else {
                    const filtered = shopItems.filter(item => item.category === category);
                    renderProducts(filtered);
                }
            };

            window.updateLocalQty = (id, change) => {
                const input = document.getElementById(`qty-${id}`);
                let val = parseInt(input.value) + change;
                if (val < 1) val = 1;
                if (val > 99) val = 99;
                input.value = val;
            };

            window.addToCartLocal = (event, id) => {
                const item = shopItems.find(i => i.id === id);
                const qty = document.getElementById(`qty-${id}`).value;
                App.addToCart(item, qty);
                
                const btn = event.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                btn.style.background = '#00ff88';
                setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 800);
            };

            window.openProductDetails = (id) => {
                const item = shopItems.find(i => i.id === id);
                const body = document.getElementById('details-modal-body');
                body.innerHTML = `
                    <div class="details-header" style="text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:20px; margin-bottom:20px;">
                        <div class="details-img-bg" style="width: 80px; height: 80px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
                            <img src="${getItemIcon(item)}" alt="${item.name}" class="details-image" style="width:50px; height:50px; object-fit:contain;">
                        </div>
                        <span class="badge" style="background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1); display: inline-block; margin-bottom: 10px;">${item.category || 'Rank'}</span>
                        <h2 class="details-title" style="margin:0; font-size:1.6rem; color:white;">${item.name}</h2>
                        <div class="details-price" style="font-size: 1.3rem; font-weight: bold; color: #f59e0b; margin-top: 5px;"><i class="fas fa-coins"></i> ${item.price_points.toLocaleString()} Points</div>
                    </div>
                    <div class="details-desc" style="color:var(--text-muted); line-height:1.6; margin-bottom:25px;">
                        <p>${item.description || 'ไม่มีคำอธิบายเพิ่มเติมสำหรับสินค้านี้'}</p>
                        <p style="font-size:0.85rem;"><small>SKU: ${item.sku}</small></p>
                    </div>
                    <button class="checkout-btn" onclick="App.addToCart({id: ${item.id}, name: '${item.name}', price_points: ${item.price_points}}, 1); document.getElementById('details-modal').classList.remove('active');" style="width:100%; padding:15px; border-radius:8px; border:none; font-weight:bold; font-size:1.1rem; display:flex; align-items:center; justify-content:center; gap:8px;"><i class="fas fa-cart-plus"></i> เพิ่มลงตะกร้า 1 ชิ้น</button>
                `;
                document.getElementById('details-modal').classList.add('active');
            };
        });
    </script>
</body>
</html>
