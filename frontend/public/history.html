<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octocraft</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/redesign.css?v=20260801-premium-ux-1">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="shop-page">
    <div class="bubbles" id="bubbles-container"></div>

    <nav class="shop-nav">
        <div class="secondary-nav-left">
            <a href="index.html" class="back-home-btn"><i data-lucide="arrow-left"></i> กลับหน้าหลัก</a>
            <div class="secondary-nav-links">
                <a href="index.html"><i data-lucide="home"></i> หน้าหลัก</a>
                <a href="shop.html"><i data-lucide="shopping-cart"></i> ร้านค้า</a>
                <a href="topup.html"><i data-lucide="gem"></i> เติมเงิน</a>
                <a href="https://discord.gg/dU2wma23f3" target="_blank"><i data-lucide="message-circle"></i> Discord</a>
            </div>
        </div>
        <div class="shop-logo-small">
            <img src="images/logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback-small').style.display='block';">
            <div id="logo-fallback-small" class="logo-fallback" style="font-size: 1.5rem; display:none;">OCTOCRAFT</div>
        </div>
        <div class="shop-nav-actions">
            <div class="user-profile-menu"></div>
        </div>
    </nav>

    <main class="account-container">
        <section class="account-hero smp-panel">
            <span class="eyebrow"><i data-lucide="history"></i> Order History</span>
            <h1>ประวัติการสั่งซื้อ</h1>
            <p>ติดตามรายการซื้อสินค้า สถานะการจัดส่ง และยอดพอยต์ที่ถูกใช้ในแต่ละคำสั่งซื้อของคุณ</p>
        </section>

        <div class="dashboard-card account-card">
            <div class="account-card-header">
            <h2 style="margin:0;"><i data-lucide="history"></i> ประวัติการสั่งซื้อ (Order History)</h2>
            </div>
            
            <div class="history-list-container" style="max-height: 500px; overflow-y: auto;">
                <ul id="order-list" style="list-style: none; padding: 0;">
                    <li class="octo-skeleton-row" aria-hidden="true"><span class="octo-skeleton octo-skeleton-icon"></span><span><i class="octo-skeleton"></i><i class="octo-skeleton"></i></span><span class="octo-skeleton octo-skeleton-value"></span></li>
                    <li class="octo-skeleton-row" aria-hidden="true"><span class="octo-skeleton octo-skeleton-icon"></span><span><i class="octo-skeleton"></i><i class="octo-skeleton"></i></span><span class="octo-skeleton octo-skeleton-value"></span></li>
                    <li class="octo-skeleton-row" aria-hidden="true"><span class="octo-skeleton octo-skeleton-icon"></span><span><i class="octo-skeleton"></i><i class="octo-skeleton"></i></span><span class="octo-skeleton octo-skeleton-value"></span></li>
                </ul>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>เราไม่มีส่วนเกี่ยวข้องกับ Mojang AB.</p>
        <p>&copy; 2026 Octocraft. All Right Reserved.</p>
    </footer>
    <script src="js/app.js?v=20260801-premium-ux-1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!App.state.token) {
                window.location.href = 'index.html?login=true';
                return;
            }

            try {
                const res = await App.api('/api/orders');
                const list = document.getElementById('order-list');
                
                if (res.ok) {
                    list.innerHTML = '';
                    if (res.orders.length === 0) {
                        list.innerHTML = `<li>${App.emptyState({ icon: 'package-open', title: 'ยังไม่มีคำสั่งซื้อ', message: 'เลือกสินค้าในร้าน แล้วติดตามสถานะจัดส่งได้จากหน้านี้' })}</li>`;
                        App.renderIcons();
                    } else {
                        res.orders.forEach(order => {
                            const li = document.createElement('li');
                            li.style.padding = '15px';
                            li.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                            li.style.display = 'flex';
                            li.style.justifyContent = 'space-between';
                            li.style.alignItems = 'center';
                            
                            const d = new Date(order.created_at).toLocaleString('th-TH');
                            
                            let statusColor = 'var(--text-muted)';
                    let statusIcon = 'clock';
                            if (order.status === 'delivered') {
                                statusColor = 'var(--success)';
                        statusIcon = 'circle-check';
                            } else if (order.status === 'delivery_failed') {
                                statusColor = 'var(--danger)';
                        statusIcon = 'circle-x';
                            }
                            
                            li.innerHTML = `
                                <div>
                                    <div style="font-weight: 600; font-size: 1.1rem; color: var(--warning);">Order #${order.id}</div>
                                    <div style="font-size: 0.85rem; color: var(--text-muted);">${d}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 1.2rem; font-weight: bold; color: var(--danger);">- ${order.total_points} Points</div>
                                <div style="font-size: 0.85rem; color: ${statusColor};"><i data-lucide="${statusIcon}"></i> สถานะ: ${order.status.toUpperCase()}</div>
                                </div>
                            `;
                            list.appendChild(li);
                        });
                        App.renderIcons();
                    }
                } else {
                    list.innerHTML = '<li style="text-align:center; color: var(--danger); padding: 20px;">ไม่สามารถโหลดประวัติได้</li>';
                }
            } catch(e) {
                document.getElementById('order-list').innerHTML = '<li style="text-align:center; color: var(--danger); padding: 20px;">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</li>';
            }
        });
    </script>
</body>
</html>
