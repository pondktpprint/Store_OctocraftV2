<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octo Craft SMP - Webshop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bubbles" id="bubbles-container"></div>

    <nav class="top-nav">
        <div class="user-profile-menu"></div>
    </nav>

    <main class="container">
        <div class="logo-container">
            <img src="images/logo.png" alt="Octo Craft SMP Logo" class="logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <div id="logo-fallback" class="logo-fallback">OCTO CRAFT SMP</div>
        </div>
        
        <div class="main-menu-container" style="justify-content: center;">
            <div class="menu-grid">
                <a href="shop.html" class="job-card">
                    <div class="card-icon">🛒</div>
                    <div class="card-content">
                        <h2>ร้านค้า (Shop)</h2>
                        <p>เลือกซื้อไอเทม กล่องสุ่ม และยศต่างๆ</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-header">
                <h3>เข้าสู่ระบบ</h3>
                <p>กรุณาเข้าสู่ระบบเพื่อเข้าใช้งาน Webshop</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="username">ชื่อตัวละคร (Username)</label>
                    <input type="text" id="username" placeholder="Minecraft Username" required>
                </div>
                <div class="input-group">
                    <label for="password">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" placeholder="รหัสผ่านของคุณ" required>
                </div>
                <button type="submit" class="submit-login-btn">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = loginForm.querySelector('.submit-login-btn');
                    btn.textContent = 'กำลังเข้าสู่ระบบ...';
                    btn.disabled = true;
                    
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        const data = await res.json();
                        
                        if (data.ok) {
                            localStorage.setItem('octo_token', data.token);
                            localStorage.setItem('octo_user', JSON.stringify(data.user));
                            App.state.token = data.token;
                            App.state.user = data.user;
                            App.renderSession();
                            document.getElementById('login-modal').classList.remove('active');
                            window.location.href = 'shop.html';
                        } else {
                            alert(data.error || 'เข้าสู่ระบบล้มเหลว');
                        }
                    } catch (err) {
                        alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
                    } finally {
                        btn.textContent = 'เข้าสู่ระบบ';
                        btn.disabled = false;
                    }
                });
            }

            // Show login modal if ?login=true
            if (new URLSearchParams(window.location.search).get('login') === 'true' && !App.state.token) {
                document.getElementById('login-modal')?.classList.add('active');
            }
        });
    </script>
</body>
</html>
