# OctoBridge configuration.
# After editing, run /octobridge reload (or restart the server).

panel:
  # WebSocket endpoint from your OctoCraft web panel.
  url: wss://panel.example.com/bridge
  # Paste the token generated by the web panel here.
  token: ""

authme:
  # MySQL credentials. Leave `auto: true` to read from plugins/AuthMe/config.yml.
  auto: true
  host: localhost
  port: 3306
  database: authme
  user: root
  password: ""
  table: authme
  columns:
    id: id
    last_name: username
    password: password
    email: email
    creation_date: regdate
    last_seen: lastlogin

nlogin:
  # MySQL credentials. Leave `auto: true` to read from plugins/nLogin/config.yml.
  auto: false
  host: localhost
  port: 3306
  database: nlogin
  user: root
  password: ""
  table: nlogin
  columns:
    id: ai
    last_name: username
    password: password
    email: email
    creation_date: creation_date
    last_seen: last_seen

bridge:
  # Which auth plugin to read from: `auto`, `authme`, or `nlogin`.
  backend: auto
  connection_pool_size: 4
  worker_threads: 4
  reconnect_initial_ms: 1000
  reconnect_max_ms: 60000
  max_inflight: 256
